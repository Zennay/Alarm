name: Android Wear OS build
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: alarm-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile-and-test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble and run unit tests
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Alarm-debug-apk
          path: app/build/outputs/apk/debug/*.apk
