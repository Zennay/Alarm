name: Build downloadable Wear OS APK

on:
  workflow_dispatch:
  push:
    branches: [main, feat/wearos-alarm-mvp]
  pull_request:

permissions:
  contents: write

concurrency:
  group: alarm-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build & test
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Rename installable APK
        if: success()
        run: cp app/build/outputs/apk/debug/app-debug.apk Alarm-WearOS.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Alarm-WearOS-APK
          path: Alarm-WearOS.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish phone-downloadable preview release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/feat/wearos-alarm-mvp'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view alarm-preview >/dev/null 2>&1; then
            gh release create alarm-preview --title "Alarm — Watch 7 test-APK" --notes "Experimentele Wear OS-wekker. Niet als enige wekker gebruiken voordat hardwaretests geslaagd zijn. Deze APK is voor je horloge, niet om als telefoon-app te openen." --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload alarm-preview Alarm-WearOS.apk --clobber
